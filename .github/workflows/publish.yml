name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.1.0" "platform-tools" >/dev/null
          sdkmanager --licenses >/dev/null || true

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias jmcomic -storepass android -keypass android \
            -dname "CN=jmcomic,O=jmcomic,C=CN" 2>/dev/null
          printf "storeFile=keystore.jks\nstorePassword=android\nkeyAlias=jmcomic\nkeyPassword=android\n" > keystore.properties

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
